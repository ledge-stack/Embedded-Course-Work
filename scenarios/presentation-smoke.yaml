name: CoCIS RFID presentation smoke test
version: 1
steps:
  - wait-serial: "entrance ready;"
  - wait-serial: "SNTP synchronized;"

  # A green card enters, then a repeated entry is rejected.
  - set-control:
      part-id: entry_rfid
      name: card
      value: 1
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=entry user=Kato Trevor uid=11223344 result=GRANTED inside=1"
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 0
  - delay: 1600ms
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 1
  - wait-serial: "ANTI-PASSBACK ALERT"
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 0

  # The same card exits, and an unregistered key fob is denied.
  - delay: 1600ms
  - set-control:
      part-id: exit_rfid
      name: card
      value: 1
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=exit user=Kato Trevor uid=11223344 result=GRANTED inside=0"
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 0
  - delay: 1600ms
  - set-control:
      part-id: entry_rfid
      name: card
      value: 5
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 1
  - wait-serial: "uid=C0FFEE99 result=DENIED inside=0 (unknown user)"
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 0
  - delay: 2000ms
