name: CoCIS RFID entry and exit
version: 1
steps:
  - wait-serial: "entrance ready;"
  - wait-serial: "SNTP synchronized;"
  - set-control:
      part-id: entry_rfid
      name: card
      value: 1
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=entry user=Demo User 2 uid=11223344 result=GRANTED inside=1"
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 0
  - delay: 500ms
  - set-control:
      part-id: exit_rfid
      name: card
      value: 1
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=exit user=Demo User 2 uid=11223344 result=GRANTED inside=0"
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 0
  - delay: 2000ms
