name: CoCIS RFID reader probe
version: 1
steps:
  - wait-serial: "entrance ready;"
  - set-control:
      part-id: entry_rfid
      name: card
      value: 1
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=entry user=Demo User 2 uid=11223344"
  - set-control:
      part-id: entry_rfid
      name: tagPresent
      value: 0
  - delay: 500ms
  - set-control:
      part-id: exit_rfid
      name: card
      value: 1
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 1
  - wait-serial: "point=exit user=Demo User 2 uid=11223344"
  - set-control:
      part-id: exit_rfid
      name: tagPresent
      value: 0
